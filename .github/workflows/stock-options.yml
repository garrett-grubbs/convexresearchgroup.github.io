name: Midday options refresh

on:
  schedule:
    # 12:30pm ET in winter, 1:30pm in summer (GitHub cron is UTC), weekdays
    - cron: "30 17 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-data-full   # never overlaps the morning full pull
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OUT_DIR: ${{ github.workspace }}/stockdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: scripts/stockdata_sync.sh pull "$OUT_DIR"
      - run: python -u scripts/fetch_stocks.py --options 500
      - run: scripts/stockdata_sync.sh push-tickers "$OUT_DIR"
