name: Update stock lookup data

on:
  schedule:
    # 6:35am ET in winter, 7:35am ET in summer (GitHub cron is UTC), weekdays
    - cron: "35 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas lxml
      - name: Fetch stock data
        run: python scripts/fetch_stocks.py
      - name: Commit
        run: |
          git config user.name "crg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/stocks
          git diff --cached --quiet && exit 0
          git commit -m "Update stock lookup data"
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break; sleep 10; done
