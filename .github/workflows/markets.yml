name: Update market data

on:
  # Runs inside the market session now (market-session.yml); kept for manual refreshes.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - name: Fetch markets
        run: python scripts/fetch_markets.py
      - name: Refresh stock lookup quotes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ github.workspace }}/stockdata
        run: |
          scripts/stockdata_sync.sh pull "$OUT_DIR" || true
          if [ -f "$OUT_DIR/index.json" ]; then
            python scripts/fetch_stocks.py --quotes && scripts/stockdata_sync.sh push "$OUT_DIR" || echo "quote refresh skipped"
          fi
      - name: Market Pulse (open and close only; skips without API key)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/market_pulse.py
      - name: Commit
        run: |
          git config user.name "crg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "Update market data"
          git pull --rebase origin main
          git push
