name: Update bonds data

on:
  schedule:
    # weekdays: before the open, after 1pm ET auction results, after the close (UTC; ET is UTC-5 in winter)
    - cron: "30 11,18,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet yfinance pandas
      - run: python -u scripts/fetch_bonds.py
      - name: Commit
        run: |
          git config user.name "crg-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bonds.json data/bond_history.json
          git diff --cached --quiet && exit 0
          git commit -m "Update bonds data"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
