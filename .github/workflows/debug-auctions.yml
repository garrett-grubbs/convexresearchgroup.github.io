name: debug auctions (temporary)
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def get(u):
              return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60).read())
          for u in ["https://www.treasurydirect.gov/TA_WS/securities/auctioned?format=json&days=550",
                    "https://www.treasurydirect.gov/TA_WS/securities/upcoming?format=json"]:
              try:
                  d = get(u); print(u, "count", len(d))
                  if d:
                      print("KEYS", " ".join(sorted(d[0].keys())))
                      done = [x for x in d if x.get("bidToCoverRatio")]
                      if done:
                          r = done[0]; print("SAMPLE", json.dumps({k: v for k, v in r.items() if v not in (None, "", "null") and any(w in k.lower() for w in ("date","term","type","yield","rate","margin","indirect","direct","dealer","competitive","offering","total","reopen","inflation","float","cash","description","price"))}))
                      notes = [x for x in d if x.get("securityType") in ("Note", "Bond")]
                      for r in (notes[:2] or d[:2]):
                          print(json.dumps({k: v for k, v in r.items() if v not in (None, "", "null")})[:1200])
                      print("date range", min(x.get("auctionDate","") for x in d), max(x.get("auctionDate","") for x in d))
              except Exception as e:
                  print(u, "ERR", e)
          PY
